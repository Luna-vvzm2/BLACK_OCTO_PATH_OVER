<!doctype html><html lang="ja"><meta charset="utf-8">
<title>BLACK OCTO PATH OVER — Web試作</title>
<style>
body{margin:0;background:#10131b;color:#eee;font:16px system-ui}main{max-width:1280px;margin:12px auto}
canvas{display:block;width:100%;height:auto;background:#000}button{padding:12px 25px;font:inherit}
#status{padding:8px;white-space:pre-wrap}p{padding:0 10px}#errors{color:#ffbb90;max-height:160px;overflow:auto}
</style><main>
<button id="start" disabled>ゲームを起動</button>
<span id="status">ゲームデータを読み込み中…</span>
<canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
<p>元ゲームのWeb移植試作。クリックして起動し、タイトル画面でEnter。操作は元のゲームのキー設定です。</p>
<p>フォントはブラウザー標準に置換。セーブはこのタブ内のみ。ゲームパッド・音声・全ステージは検証中。</p>
<pre id="errors"></pre>
</main><script>
const statusNode=document.getElementById('status'),errors=document.getElementById('errors');
const web={
 images:[],sounds:[],keys:{},mouse:{x:0,y:0,buttons:0},background:'#000',paths:null,audio:null,ctx:null,
 resolve(path){
   path=path.replaceAll('\\','/').replace(/^\.\//,'').replace(/^\/+/,'');
   if(!this.paths){
     this.paths=new Map();
     const walk=(root)=>{for(const n of FS.readdir(root)){if(n==='.'||n==='..')continue;const p=root+'/'+n;
       if(FS.isDir(FS.stat(p).mode))walk(p);else this.paths.set(p.slice(1).toLowerCase(),p);}};
     walk('/assets');
   }
   return this.paths.get(path.toLowerCase())||'/'+path;
 },
 async loadImage(path){
   try{
     const bytes=FS.readFile(this.resolve(path));
     const image=await createImageBitmap(new Blob([bytes]));
     return this.images.push({image,x:0,y:0,w:image.width,h:image.height})-1;
   }catch(e){Module.printErr('画像を読めません: '+path+' '+e);return -1;}
 },
 async loadSound(path){
   try{
     const bytes=FS.readFile(this.resolve(path));
     const buffer=await this.audio.decodeAudioData(bytes.slice().buffer);
     const gain=this.audio.createGain();gain.connect(this.audio.destination);
     return this.sounds.push({buffer,gain,source:null})-1;
   }catch(e){Module.printErr('音を読めません: '+path+' '+e);return -1;}
 },
 stopSounds(){for(const s of this.sounds)if(s?.source){s.source.stop();s.source=null;}},
 init(){
   this.ctx=Module.canvas.getContext('2d');this.ctx.imageSmoothingEnabled=false;
   statusNode.textContent='実行中';
   return 0;
 }
};
var Module={
 canvas:document.getElementById('canvas'),web,noInitialRun:true,
 onRuntimeInitialized(){statusNode.textContent='準備完了';document.getElementById('start').disabled=false;},
 printErr(text){console.error(text);errors.textContent+=(text+'\n');},
 print(text){console.log(text);},
 onAbort(reason){statusNode.textContent='停止: '+reason;},
 setStatus(text){if(text)statusNode.textContent=text;}
};
window.addEventListener('keydown',e=>{
 if(document.activeElement!==Module.canvas)return;
 web.keys[e.keyCode]=true;e.preventDefault();
});
window.addEventListener('keyup',e=>{delete web.keys[e.keyCode];});
window.addEventListener('blur',()=>{web.keys={};web.mouse.buttons=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){web.keys={};web.mouse.buttons=0;}});
Module.canvas.addEventListener('pointerdown',e=>{Module.canvas.focus();web.mouse.buttons=e.buttons;});
window.addEventListener('pointerup',e=>{web.mouse.buttons=e.buttons;});
Module.canvas.addEventListener('pointermove',e=>{const r=Module.canvas.getBoundingClientRect();
 web.mouse.x=(e.clientX-r.left)*Module.canvas.width/r.width;web.mouse.y=(e.clientY-r.top)*Module.canvas.height/r.height;});
Module.canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('start').onclick=async()=>{
 document.getElementById('start').disabled=true;
 web.audio=new AudioContext();await web.audio.resume();Module.canvas.focus();
 try{Module.callMain([]);}catch(e){Module.printErr(String(e));}
};
</script>{{{ SCRIPT }}}</html>
